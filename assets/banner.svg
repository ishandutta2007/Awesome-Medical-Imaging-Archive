<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#11998e" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .wave-line {
        animation: wave 6s ease-in-out infinite alternate;
      }
      .scan-line {
        animation: scan 3s linear infinite;
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.3; }
        100% { transform: scale(1.03); opacity: 0.7; }
      }
      @keyframes scan {
        0% { transform: translateY(-50px); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: translateY(350px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="12"/>

  <!-- Dynamic Animated Graphic Elements in Background -->
  <g opacity="0.25">
    <!-- Grid Overlay -->
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#4facfe" stroke-width="0.5" stroke-dasharray="4 4"/>
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" stroke="#4facfe" stroke-width="0.5" stroke-dasharray="4 4"/>
    
    <!-- Pulse Rings -->
    <circle cx="1000" cy="180" r="140" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="pulse-circle" style="transform-origin: 1000px 180px;"/>
    <circle cx="1000" cy="180" r="90" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="1000" cy="180" r="40" fill="url(#glowGrad)"/>

    <circle cx="150" cy="100" r="80" fill="none" stroke="#38ef7d" stroke-width="1.5" stroke-dasharray="4 4" class="pulse-circle" style="transform-origin: 150px 100px;"/>
  </g>

  <!-- Medical Imaging Icon Graphics (Right Side Decor) -->
  <g transform="translate(930, 110)" filter="url(#shadow)">
    <!-- Cross / Medical Symbol & DICOM Grid -->
    <rect x="55" y="20" width="30" height="100" rx="6" fill="#00f2fe" opacity="0.9"/>
    <rect x="20" y="55" width="100" height="30" rx="6" fill="#00f2fe" opacity="0.9"/>
  </g>

  <!-- Title & Subtitle Foreground (High Visibility & Contrast) -->
  <g transform="translate(80, 130)" filter="url(#shadow)">
    <!-- Main Title -->
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="0.5">
      Awesome Medical Imaging Archive 🏥
    </text>
    
    <!-- Subtitle -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#64ffda" letter-spacing="0.2">
      Cloud PACS • VNA • DICOM Archives • Enterprise Imaging • Open-Source Viewers
    </text>

    <!-- Tagline Badges -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="140" height="30" rx="15" fill="#1e3a8a"/>
      <text x="70" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle">SaaS Ecosystem</text>

      <rect x="155" y="0" width="170" height="30" rx="15" fill="#064e3b"/>
      <text x="240" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#6ee7b7" text-anchor="middle">Open-Source DICOM</text>

      <rect x="340" y="0" width="160" height="30" rx="15" fill="#312e81"/>
      <text x="420" y="20" font-family="sans-serif" font-size="13" font-weight="600" fill="#c7d2fe" text-anchor="middle">Market Intelligence</text>
    </g>
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="url(#accentGrad)"/>
</svg>
